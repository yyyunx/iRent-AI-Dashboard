<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/uploads/assets/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iRent AI 智慧營運中控台</title>
    <!-- Inter & Noto Sans TC Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
      /* Global reset for loading screen */
      body {
        margin: 0;
        background-color: #f5f5f5;
        font-family: 'Inter', 'Noto Sans TC', sans-serif;
      }
      .pre-hydration-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f5f5f5;
        z-index: 9999;
      }
      .brand-box {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background-color: #c62828;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 24px;
        font-weight: 800;
        box-shadow: 0 12px 24px rgba(198, 40, 40, 0.22);
        margin-bottom: 24px;
        animation: pulse 1.8s infinite ease-in-out;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(198, 40, 40, 0.1);
        border-radius: 50%;
        border-top-color: #c62828;
        animation: spin 1s ease-in-out infinite;
        margin-bottom: 12px;
      }
      .loading-text {
        font-size: 15px;
        color: #6f6f6f;
        font-weight: 500;
        letter-spacing: 0.5px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.95); opacity: 0.85; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Loading view before hydration -->
      <div class="pre-hydration-loader">
        <div class="brand-box">iR</div>
        <div class="spinner"></div>
        <div class="loading-text">載入系統中...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
