services:
  - type: web
    name: irent-ops-dashboard
    env: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --dir frontend install --frozen-lockfile && pnpm --dir backend install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/irent_ops.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: SESSION_TTL_SECONDS
        value: 28800
      - key: COOKIE_SAME_SITE
        value: Lax
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_TARGET_ID
        sync: false
      - key: PUBLIC_DASHBOARD_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
    disk:
      name: irent-ops-data
      mountPath: /var/data
      sizeGB: 1
