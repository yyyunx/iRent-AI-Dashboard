services:
  - type: web
    name: irent-ops-dashboard
    env: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --dir frontend install --frozen-lockfile && pnpm --dir backend install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/irent_ops.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: SLACK_WEBHOOK_URL
        sync: false
    disk:
      name: irent-ops-data
      mountPath: /var/data
      sizeGB: 1
